<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Off-white disc with a hairline ring: the ring is what stops the icon
       disappearing into a light browser tab strip. -->
  <circle cx="16" cy="16" r="16" fill="#F4F3F1"/>
  <circle cx="16" cy="16" r="15.25" fill="none" stroke="#DAD6D0" stroke-width="1.5"/>
  <!-- Two peaks rather than the wordmark's four: at 16px the denser wave turns
       to mush, while this still reads as a cadence. -->
  <path d="M6 19c2 0 3-6 5-6s3 6 5 6 3-6 5-6 3 6 5 6"
        fill="none" stroke="#15793F" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
